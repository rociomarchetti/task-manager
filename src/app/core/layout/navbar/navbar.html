<mat-toolbar class="brutal-nav">
  <span class="nav-logo">Task Manager</span>

  <div class="nav-links">
    <a routerLink="/app/dashboard" routerLinkActive="active">Dashboard</a>
    <span>|</span>
    <a routerLink="/app/boards-list" routerLinkActive="active">Mis tableros</a>
  </div>

  <div class="nav-actions">
    <mat-slide-toggle
      [checked]="theme.isDark()"
      labelPosition="before"
      (change)="theme.toggle()"
    >
      <span class="theme-label">
        {{ theme.isDark() ? '🌙 Dark Mode' : '☀️ Light Mode' }}
      </span>
    </mat-slide-toggle>
    <button class="logout-btn" mat-stroked-button (click)="logout()">
      Cerrar sesión
    </button>
    @if(viewModel$ | async; as vm) {
    <button
      mat-stroked-button
      color="primary"
      class="avatar"
      [matTooltip]="getUserName(vm.user)"
      [matTooltipPosition]="'above'"
    >
      {{vm.userInitials}}
    </button>
    }
    <button
      mat-icon-button
      class="hamburger-btn"
      [matMenuTriggerFor]="mobileMenu"
    >
      <mat-icon>menu</mat-icon>
    </button>
  </div>
</mat-toolbar>

<!-- Menú mobile -->
<mat-menu #mobileMenu="matMenu" class="brutal-mobile-menu">
  <a mat-menu-item routerLink="/app/dashboard" routerLinkActive="active">
    <mat-icon>dashboard</mat-icon>
    Dashboard
  </a>
  <a mat-menu-item routerLink="/app/boards-list" routerLinkActive="active">
    <mat-icon>view_kanban</mat-icon>
    Mis tableros
  </a>
  <mat-divider />
  <button mat-menu-item (click)="logout()">
    <mat-icon>logout</mat-icon>
    Cerrar sesión
  </button>
</mat-menu>
