@if(viewModel$ | async; as vm) {
<section class="board-create__edit">
  <app-board-form
    [mode]="FormMode.EDIT"
    [board]="vm.currentBoard"
    [tasks]="vm.taskLists"
    (addTask)="onAddTaskClicked()"
    (saveBoardChanges)="onSaveBoardChanges($event)"
    (cancelChanges)="onCancelChanges()"
  ></app-board-form>
</section>

<app-task-modal
  [mode]="FormMode.CREATE"
  [isModalOpen]="isModalOpen()"
  [currentBoards]="vm.boards"
  [isCreatingTaskFromBoard]="true"
  [currentBoardId]="vm.currentBoard?.id"
  (modalClosed)="onModalClosed()"
  (saveNewTask)="onSaveNewTask($event)"
></app-task-modal>
}
