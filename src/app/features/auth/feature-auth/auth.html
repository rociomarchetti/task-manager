@if (viewModel$ | async; as vm) {
<div class="auth-container">
  <app-panel>
    <div appPanelBody>
      <mat-tab-group [(selectedIndex)]="vm.defaultSelectedTab">
        <mat-tab label="Login">
          <div class="auth-tab">
            <app-login-form
              (loginRequested)="onLoginRequest($event)"
            ></app-login-form>
          </div>
        </mat-tab>
        <mat-tab label="Register">
          <div class="auth-tab">
            <app-register-form
              (registerRequested)="onRegisterRequest($event)"
            ></app-register-form>
          </div>
        </mat-tab>
      </mat-tab-group>
    </div>
  </app-panel>
</div>
}
