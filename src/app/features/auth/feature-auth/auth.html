@if (viewModel$ | async; as vm) {
<mat-tab-group [(selectedIndex)]="vm.defaultSelectedTab">
  <mat-tab label="Login">
    <app-login-form (loginRequested)="onLoginRequest($event)"></app-login-form>
  </mat-tab>
  <mat-tab label="Register">
    <app-register-form
      (registerRequested)="onRegisterRequest($event)"
    ></app-register-form>
  </mat-tab>
</mat-tab-group>
}
