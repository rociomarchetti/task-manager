<div class="board-grid">
  @for (board of boardsToShow(); track $index) {
  <div class="board-card">
    <div class="board-card__header">
      <span class="board-card__label">{{ board.title }}</span>
      @if (board.isFavorite) {
      <span class="material-icons">favorite</span>
      }
    </div>
    <div class="board-card__content">
      @if(board.description){
      <p>Description:</p>
      <p>{{ board.description }}</p>
      }
      <p>Created: {{formatDate(board.createdAt)}}</p>
    </div>
    <div class="board-card__footer">
      <button mat-stroked-button (click)="onGoToBoardDetails(board.id)">
        View Board
      </button>
      <button
        [matTooltip]="'Delete'"
        [matTooltipPosition]="'above'"
        mat-mini-fab
        (click)="onRemoveBoard(board)"
      >
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </div>
  }
</div>

<app-confirmation-modal
  [isModalOpen]="isModalOpen()"
  [elementTitle]="selectedBoard()?.title"
  [elementType]="'board'"
  (actionConfirmed)="onModalConfirmDeletion()"
  (modalClosed)="onModalClosed()"
></app-confirmation-modal>
