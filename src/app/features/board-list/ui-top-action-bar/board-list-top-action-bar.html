<section>
  <div class="top-actions-group">
    <mat-button-toggle-group>
      <mat-button-toggle (click)="toggleFavorites(false)"
        >Mostrar todos
      </mat-button-toggle>
      <mat-button-toggle (click)="toggleFavorites(true)"
        >Mostrar solo favoritos
      </mat-button-toggle>
    </mat-button-toggle-group>

    <form>
      <mat-form-field>
        <input
          type="text"
          matInput
          [placeholder]="isFocused() ? '' : 'Escribir nombre del tablero'"
          (focus)="isFocused.set(true)"
          (blur)="isFocused.set(false)"
          [formControl]="searchBoard"
          [matAutocomplete]="auto"
        />
        <mat-autocomplete #auto="matAutocomplete">
          @for (option of filteredTitles(); track option) {
          <mat-option [value]="option">{{ option }}</mat-option>
          }
        </mat-autocomplete>
      </mat-form-field>
    </form>

    <button mat-stroked-button color="primary" (click)="onCreateBoardClicked()">
      + Nuevo tablero
    </button>
  </div>
</section>
