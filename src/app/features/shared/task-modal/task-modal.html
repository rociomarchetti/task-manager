<app-modal [isOpen]="isModalOpen()" (closeModal)="onCloseModal()">
  <ng-container ModalHeader>
    <p>Título: {{selectedTask()?.title}}</p>
    <p>Estado de la tarea: {{selectedTask()?.status}}</p>
  </ng-container>
  <ng-container ModalContent>
    <p>{{selectedTask()?.description}}</p>
    <p>Fecha de creación: {{selectedTask()?.createdAt}}</p>
    <p>Fecha de vencimiento: {{selectedTask()?.dueDate}}</p>
  </ng-container>
</app-modal>
