<div class="content">
  <mat-icon class="item-icon"
    >{{ variant() === 'task' ? 'task' : 'view_kanban' }}</mat-icon
  >
  <p>{{itemTitle()}}</p>
</div>

<section class="actions">
  <div class="buttons-container">
    <button mat-mini-fab [matTooltip]="'See'" (click)="onActionClick('see')">
      <mat-icon>visibility</mat-icon>
    </button>
    <button
      mat-mini-fab
      [matTooltip]="'Delete'"
      (click)="onActionClick('remove')"
    >
      <mat-icon>delete</mat-icon>
    </button>
  </div>

  <!-- more options menu -->
  @if(hasMoreOptions()) {
  <button
    matIconButton
    [matTooltip]="'More options'"
    [matMenuTriggerFor]="menu"
  >
    <mat-icon>more_vert</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    @for (action of actions(); track action.id) {
    <button
      mat-menu-item
      type="button"
      (click)="onActionClick(action.id)"
      [attr.aria-label]="action.label"
      [title]="action.label"
    >
      <div class="mat-menu-option">
        <span class="material-icons">{{ action.icon }}</span>
        <span>{{action.label}}</span>
      </div>
    </button>
    }
  </mat-menu>
  }
</section>
