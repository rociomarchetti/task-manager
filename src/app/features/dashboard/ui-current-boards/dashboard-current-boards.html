<app-panel>
  <div appPanelBody>
    <h4>Tableros con actividades en curso:</h4>
    <app-list
      [listItems]="mockBoards"
      [emptyStateMssg]="'No hay tableros aún.'"
    >
      @for(item of mockBoards; track $index; let i = $index ) {
      <app-board-list-item
        [board]="item"
        (seeBoard)="onGoToBoard($event)"
        (removeBoard)="onRemoveBoard($event)"
      ></app-board-list-item>
      }
    </app-list>
  </div>
</app-panel>
