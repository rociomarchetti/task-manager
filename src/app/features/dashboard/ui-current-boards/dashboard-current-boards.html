<app-panel>
  <div appPanelBody>
    <h4>Boards with ongoing activities:</h4>
    <app-list
      [listItems]="currentBoards()"
      [emptyStateMssg]="'There are no boards yet.'"
    >
      @for(item of currentBoards(); track $index; let i = $index ) {
      <app-board-list-item
        [board]="item"
        (seeBoard)="onGoToBoard($event)"
        (removeBoard)="onRemoveBoard($event)"
      ></app-board-list-item>
      }
    </app-list>
  </div>
</app-panel>

<app-confirmation-modal
  [isModalOpen]="isModalOpen()"
  [elementTitle]="selectedBoard()?.title"
  [elementType]="'board'"
  (actionConfirmed)="onModalConfirmDeletion()"
  (modalClosed)="onModalClosed()"
></app-confirmation-modal>
