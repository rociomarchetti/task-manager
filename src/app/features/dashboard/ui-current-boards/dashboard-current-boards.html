<app-panel>
  <div appPanelBody>
    Tableros con actividades en curso:
    <app-list [listItems]="mockBoards" [variant]="'two'">
      @for(item of mockBoards; track $index; let i = $index ) {
      <app-board-list-item
        [board]="item"
        (seeBoard)="onGoToBoard($event)"
        (removeBoard)="onRemoveBoard($event)"
      ></app-board-list-item>
      }
    </app-list>
  </div>
</app-panel>
