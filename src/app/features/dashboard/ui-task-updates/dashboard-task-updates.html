@for (section of sections; track $index) { @if (section.tasks()?.length > 0) {
<app-panel>
  <div appPanelBody>
    <h4>{{ section.title }}</h4>

    <app-list [listItems]="section.tasks()" [variant]="'one'">
      @for (task of section.tasks(); track $index) {
      <app-task-list-item
        [task]="task"
        (seeTask)="onSeeTask($event)"
        (removeTask)="onRemoveTask($event)"
        (markAsCompleted)="onMarkTaskAsCompleted($event)"
        (editTask)="onEditTask($event)"
        (postponeTask)="onPostponeTask($event)"
      />
      }
    </app-list>
  </div>
</app-panel>
} }
