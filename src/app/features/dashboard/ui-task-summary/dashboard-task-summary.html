<app-panel>
  <div appPanelHeader>
    <p>
      Total tareas: {{tasks().pending + tasks().inProgress + tasks().completed}}
    </p>
    <p>Tareas pendientes: {{tasks().pending}}</p>
  </div>
  <div appPanelBody>
    <p>Tareas en progreso: {{tasks().inProgress}}</p>
  </div>
  <div appPanelFooter>
    <p>Tareas completadas: {{tasks().completed}}</p>
  </div>
</app-panel>
