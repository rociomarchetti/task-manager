@if(viewModel$ | async; as vm) {
<p>
  ¡¡Hola {{vm.userName}}!! Tienes {{vm.tasksAmounts.pending}} @if
  (vm.tasksAmounts.pending === 1) { tarea pendiente. } @else { tareas
  pendientes. }
</p>
<section class="panel-group">
  <app-dashboard-task-summary
    [tasks]="vm.tasksAmounts"
  ></app-dashboard-task-summary>
  <app-dashboard-task-updates
    [recentlyCreatedTasks]="vm.recentlyCreatedTasks"
    [recentlyUpdatedTasks]="vm.recentlyUpdatedTasks"
    [tasksDueSoon]="vm.tasksDueSoon"
    (markTaskAsDone)="onMarkTaskAsDone($event)"
    (editTaskClicked)="onEditTask($event)"
    (seeDetailsClicked)="onSeeTaskDetails($event)"
    (postponeTaskClicked)="onPostponeTask($event)"
  ></app-dashboard-task-updates>
  <div>
    <app-dashboard-current-boards
      [currentBoards]="vm.currentBoards"
      (goToBoardClicked)="onGoToBoard($event)"
    ></app-dashboard-current-boards>
    <app-dashboard-quick-actions
      (createNewBoardClicked)="onCreateNewBoard()"
      (createNewTaskClicked)="onCreateNewTaskClicked()"
      (goToBoardsListClicked)="onGoToBoardsListClicked()"
    ></app-dashboard-quick-actions>
  </div>
</section>

<app-task-modal
  [isModalOpen]="isModalOpen()"
  [selectedTask]="selectedTask()"
  (modalClosed)="onModalClosed()"
></app-task-modal>
}
